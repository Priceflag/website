<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Priceflag — The wind tunnel (sim B)</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hedvig+Letters+Serif:opsz@12..24&amp;family=Inter:wght@300..700&amp;display=swap" rel="stylesheet">
<style>
  html{background:#030818;overscroll-behavior-y:none;}
  body{margin:0;background:#030818;color:#f3ecde;overscroll-behavior-y:none;}
  ::selection{background:#d8f24b;color:#071238;}

  /* Demo-only chrome. Nothing in here belongs to the section — the section
     brings its own DOM and its own stylesheet. */
  .demo-bar{
    position:fixed;top:0;left:0;right:0;z-index:99;
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:9px clamp(16px,4vw,40px);
    border-bottom:1px solid rgba(128,128,128,.28);
    background:rgba(10,10,14,.72);backdrop-filter:blur(12px);
    font-family:'Inter',system-ui,sans-serif;font-size:11.5px;letter-spacing:.02em;
    color:rgba(243,236,222,.62);
  }
  .demo-bar strong{
    font-family:'Hedvig Letters Serif',Georgia,serif;font-weight:400;
    font-size:16px;letter-spacing:-.01em;color:#f3ecde;
  }
  .demo-bar button{
    font:inherit;color:#f3ecde;background:transparent;cursor:pointer;
    border:1px solid rgba(243,236,222,.26);border-radius:999px;padding:4px 12px;
  }
  .demo-bar button:hover{border-color:#d8f24b;color:#d8f24b;}
  .demo-bar button:focus-visible{outline:2px solid #93aaff;outline-offset:3px;}
  .demo-bar code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
  .demo-p{font-variant-numeric:tabular-nums;min-width:15ch;}
  .demo-jump{display:flex;gap:5px;flex-wrap:wrap;}

  /* Enough page above and below to prove the pinning behaves at both seams and
     that the section really is driven by the DOCUMENT scroll. */
  .demo-lead,.demo-tail{
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;padding:0 clamp(20px,5vw,60px);text-align:center;
  }
  .demo-lead{background:#030818;color:rgba(243,236,222,.5);}
  /* The tail inherits the light end of the section, which is the whole point of
     ending on cream. */
  .demo-tail{background:#f3ecde;color:#0d2168;}
  .demo-lead p,.demo-tail p{
    max-width:34ch;margin:0;
    font-family:'Hedvig Letters Serif',Georgia,serif;font-size:clamp(19px,2.6vw,30px);
    line-height:1.3;
  }
</style>
</head>
<body>

<div class="demo-bar">
  <strong>Wind tunnel</strong>
  <span class="demo-p" id="demo-p">p 0.000 · —</span>
  <span class="demo-jump" id="demo-jump"></span>
  <button type="button" id="demo-toggle">Unmount</button>
  <button type="button" id="demo-probe">Probe</button>
  <span id="demo-note"></span>
</div>

<section class="demo-lead"><p>Scroll down. The section below is the whole product, told once.</p></section>

<!-- The section builds everything it needs inside this empty div. -->
<div id="host"></div>

<section class="demo-tail"><p>The page carries on, in the light the tunnel left behind.</p></section>

<script src="../sections/pf-sim-b.js"></script>
<script>
(function () {
  var host = document.getElementById('host');
  var pEl = document.getElementById('demo-p');
  var noteEl = document.getElementById('demo-note');
  var toggle = document.getElementById('demo-toggle');
  var probe = document.getElementById('demo-probe');
  var jump = document.getElementById('demo-jump');
  var cleanup = null;

  /* Jump buttons, so every act can be exercised without a long scroll. They
     move the DOCUMENT scroll — the section is never driven directly, because
     that is exactly what would hide a bug. */
  var MARKS = window.initPfSimB.ACTS.map(function (a) {
    return { label: a.label.replace('The ', ''), p: Math.min(0.99, a.mark + 0.06) };
  });
  MARKS.forEach(function (m) {
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = m.label;
    b.addEventListener('click', function () {
      var track = host.querySelector('.pfw-track');
      if (!track) return;
      var top = track.getBoundingClientRect().top + window.pageYOffset;
      var span = track.offsetHeight - window.innerHeight;
      window.scrollTo({ top: top + span * m.p, behavior: 'smooth' });
    });
    jump.appendChild(b);
  });

  function mount() {
    cleanup = window.initPfSimB(host);
    toggle.textContent = 'Unmount';
    noteEl.textContent = 'mounted';
  }
  function unmount() {
    if (cleanup) cleanup();
    cleanup = null;
    toggle.textContent = 'Mount';
    noteEl.textContent = 'unmounted · host empty: ' + (host.childNodes.length === 0) +
      ' · stylesheet gone: ' + !document.getElementById('pfw-style');
  }
  toggle.addEventListener('click', function () {
    if (cleanup) unmount(); else mount();
  });

  /* Reads what is actually painted rather than what we hope is painted.
     Screenshots are not trustworthy in this environment; text is. */
  probe.addEventListener('click', function () {
    var q = function (sel) { var n = host.querySelector(sel); return n ? n.textContent : null; };
    var root = host.querySelector('.pfw-root');
    var out = {
      progress: readProgress(),
      eyebrow: q('.pfw-eyebrow'),
      readout: q('.pfw-readout'),
      unit: q('.pfw-unit'),
      flag: q('.pfw-flag'),
      live: q('.pfw-sr'),
      background: root && root.style.getPropertyValue('--pfw-bg'),
      ink: root && root.style.getPropertyValue('--pfw-ink'),
      state: window.initPfSimB.stateAt(readProgress(), 0)
    };
    console.log(out);
    noteEl.textContent = 'probed → console';
  });

  function readProgress() {
    var track = host.querySelector('.pfw-track');
    if (!track) return 0;
    var r = track.getBoundingClientRect();
    var total = r.height - window.innerHeight;
    return total > 4 ? Math.max(0, Math.min(1, -r.top / total)) : 0;
  }

  function label() {
    var p = readProgress();
    var s = window.initPfSimB.stateAt(p, 0);
    pEl.textContent = 'p ' + p.toFixed(3) + ' · ' + s.read;
  }
  window.addEventListener('scroll', label, { passive: true });
  setInterval(label, 120);   // the bar must update even when rAF is starved

  mount();
  label();
  window.__pfwCleanup = unmount;
})();
</script>

</body>
</html>
