<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Priceflag — waitlist B ("the ticket") prototype</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hedvig+Letters+Serif:opsz@12..24&amp;family=Inter:wght@300..700&amp;display=swap" rel="stylesheet">
<style>
/* =====================================================================
   PAGE BASELINE — mirrors index.html's globals so the prototype starts
   from exactly the same conditions the real page imposes, including the
   global a:hover and the dark overscroll background. Nothing here belongs
   to the module; the module ships its own styles.
   ===================================================================== */
html{overscroll-behavior-y:none;background:#030818;}
body{margin:0;padding:0;background:#030818;overscroll-behavior-y:none;}
a{color:#f3ecde;text-decoration:none;}
a:hover{color:#d8f24b;}
::selection{background:#d8f24b;color:#071238;}

/* ---- prototype scaffolding only ---------------------------------- */
.demo-bar{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:9px clamp(16px,4vw,28px);
  background:rgba(3,8,24,.92);
  border-bottom:1px solid rgba(243,236,222,.09);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  font-family:'Inter',system-ui,'Helvetica Neue',Arial,sans-serif;
  font-size:12.5px;color:rgba(243,236,222,.6);
}
.demo-bar strong{
  font-family:'Hedvig Letters Serif',Georgia,serif;
  font-weight:400;font-size:17px;color:#f3ecde;letter-spacing:-0.01em;
}
.demo-bar button{
  font:inherit;font-weight:500;cursor:pointer;
  padding:5px 12px;border-radius:999px;
  color:rgba(243,236,222,.8);
  background:rgba(243,236,222,.05);
  border:1px solid rgba(243,236,222,.16);
  transition:color .25s ease,border-color .25s ease,background-color .25s ease;
}
.demo-bar button:hover{color:#d8f24b;border-color:rgba(216,242,75,.4);background:rgba(216,242,75,.07);}
.demo-bar button:focus-visible{outline:2px solid rgba(216,242,75,.85);outline-offset:2px;}
.demo-bar .demo-spacer{flex:1 1 auto;}

/* A stand-in for the FAQ that sits directly above this section. */
.demo-above{
  display:flex;align-items:flex-end;
  min-height:26vh;padding:0 clamp(20px,5vw,64px) clamp(26px,4vw,52px);
  font-family:'Hedvig Letters Serif',Georgia,Cambria,'Times New Roman',serif;
  font-size:clamp(22px,2.8vw,38px);line-height:1.22;letter-spacing:-0.015em;
  color:rgba(243,236,222,.3);max-width:1180px;margin:0 auto;text-wrap:pretty;
}

/* The neon footer slab that sits directly beneath this section on the real
   page, so the section's quiet dark tail can be judged against it. */
.demo-foot{
  background:#d8f24b;color:#0d1f00;border-radius:26px 26px 0 0;
  padding:clamp(34px,5vw,64px) clamp(20px,5vw,64px);
  font-family:'Hedvig Letters Serif',Georgia,Cambria,'Times New Roman',serif;
  font-size:clamp(26px,3.4vw,46px);line-height:1.1;letter-spacing:-0.02em;
  box-shadow:0 50vh 0 0 #d8f24b;position:relative;z-index:2;
}
</style>
</head>
<body>

<div class="demo-bar">
  <strong>Priceflag</strong>
  <span>sections/pf-waitlist-b.js</span>
  <span class="demo-spacer"></span>
  <span id="demo-state">mounted</span>
  <button type="button" id="demo-toggle">Unmount</button>
  <button type="button" id="demo-remount">Remount</button>
  <button type="button" id="demo-stub">Stub SUBMIT</button>
</div>

<div class="demo-above">The section below is built entirely by the module — this page contributes no markup to it.</div>

<!-- The module builds all of its own DOM inside this empty host. -->
<div id="pf-waitlist-b-host"></div>

<footer class="demo-foot">A tool for Shopify</footer>

<script src="../sections/pf-waitlist-b.js"></script>
<script>
(function () {
  var host = document.getElementById('pf-waitlist-b-host');
  var state = document.getElementById('demo-state');
  var cleanup = null;

  function mount() {
    if (cleanup) return;
    cleanup = window.initPfWaitlistB(host);
    state.textContent = 'mounted';
  }
  function unmount() {
    if (!cleanup) return;
    cleanup();
    cleanup = null;
    state.textContent = 'unmounted — host is empty, style tag removed';
  }

  document.getElementById('demo-toggle').addEventListener('click', function () {
    if (cleanup) { unmount(); this.textContent = 'Mount'; }
    else { mount(); this.textContent = 'Unmount'; }
  });
  document.getElementById('demo-remount').addEventListener('click', function () {
    unmount(); mount();
    document.getElementById('demo-toggle').textContent = 'Unmount';
  });

  /* Demonstrates the single integration seam: swap the mailto default for
     something else without touching the module. */
  var real = window.initPfWaitlistB.SUBMIT, stubbed = false;
  document.getElementById('demo-stub').addEventListener('click', function () {
    stubbed = !stubbed;
    this.textContent = stubbed ? 'Real SUBMIT' : 'Stub SUBMIT';
    window.initPfWaitlistB.SUBMIT = stubbed ? function (p) {
      /* eslint-disable no-console */
      if (window.console && console.log) console.log('SUBMIT payload', p);
      return new Promise(function (res) {
        setTimeout(function () {
          res({ ok: true, mode: 'api', note: 'Stub endpoint accepted ' + p.email + '.' });
        }, 400);
      });
    } : real;
  });

  mount();
})();
</script>
</body>
</html>
